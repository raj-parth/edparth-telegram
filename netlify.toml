# ═══════════════════════════════════════════════════════════════════
# EDPARTH — NETLIFY PRODUCTION & SECURITY CONFIGURATION
# ═══════════════════════════════════════════════════════════════════

[build]
  publish = "."

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking / iframe embedding
    X-Frame-Options = "DENY"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Enable browser XSS protection
    X-XSS-Protection = "1; mode=block"
    
    # Secure referrer leakage
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Disable sensitive browser APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    
    # Strict Content Security Policy (allows local assets, Google Fonts, and Telegram CDN fallbacks)
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://cdn5.telesco.pe https://*.telesco.pe; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    
    # Strict Transport Security (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# HTML: Always ensure fresh load for immediate channel updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS & JavaScript Caching
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

# Images & Vector Assets Caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
