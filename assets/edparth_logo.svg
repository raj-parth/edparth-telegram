<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075e4d"/>
      <stop offset="100%" stop-color="#04392e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe071"/>
      <stop offset="100%" stop-color="#f8cc49"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="url(#bgGrad)" stroke="#f8cc49" stroke-width="2.5"/>

  <!-- Guiding North Star (Parth Beacon) -->
  <polygon points="50,9 52.8,15.5 59.8,16.2 54.5,20.8 56.2,27.7 50,24 43.8,27.7 45.5,20.8 40.2,16.2 47.2,15.5" fill="#49e3e6" filter="url(#glow)"/>

  <!-- Ascending Arrow of Focus (Central Parth Axis) -->
  <!-- Arrowhead -->
  <polygon points="50,24 61,38 54.5,38 54.5,46 45.5,46 45.5,38 39,38" fill="url(#goldGrad)"/>

  <!-- Arrow Shaft extending down to base -->
  <rect x="46" y="44" width="8" height="42" fill="url(#goldGrad)"/>

  <!-- Left Monogram: Letter 'E' (Education / Knowledge Blocks) -->
  <!-- Top bar -->
  <rect x="23" y="44" width="20" height="7.5" rx="2" fill="url(#goldGrad)"/>
  <!-- Middle bar -->
  <rect x="30" y="55.5" width="13" height="6.5" rx="1.5" fill="#ffffff"/>
  <!-- Bottom bar -->
  <rect x="23" y="66.5" width="20" height="7.5" rx="2" fill="url(#goldGrad)"/>
  <!-- Left vertical spine -->
  <rect x="23" y="44" width="7.5" height="30" rx="2" fill="url(#goldGrad)"/>

  <!-- Right Monogram: Letter 'P' (Parth / Pathway / Progress) -->
  <!-- P Loop -->
  <path d="M54 44 H68 C76 44 81 49 81 56 C81 63 76 68 68 68 H54 V44 Z" fill="url(#goldGrad)"/>
  <!-- P Inner Cutout (White or background) -->
  <path d="M54 51 H66 C70 51 73 53 73 56 C73 59 70 61 66 61 H54 V51 Z" fill="#ffffff"/>
</svg>
