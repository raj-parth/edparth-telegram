<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 — Page Not Found | EdParth</title>
  
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0c26;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow-x: hidden;
    }
    .error-card {
      max-width: 520px;
      width: 100%;
      background: #131448;
      border: 2px solid rgba(248, 204, 73, 0.4);
      border-radius: 24px;
      padding: 50px 32px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
    }
    .error-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #f8cc49;
    }
    .error-logo img { width: 100%; height: 100%; object-fit: cover; }
    .error-num {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 6.5rem;
      font-weight: 900;
      color: #f8cc49;
      line-height: 0.9;
      text-shadow: 4px 4px 0px #042d25;
      margin-bottom: 12px;
    }
    .error-title {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #efb1c0;
      margin-bottom: 14px;
    }
    .error-desc {
      color: #d1d5f0;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #f8cc49;
      color: #0f1040;
      padding: 14px 32px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(248, 204, 73, 0.4);
    }
    .btn-home:hover {
      background: #ffffff;
      color: #054d3f;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-logo">
      <svg viewBox="0 0 52 52" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="50" height="50" rx="13" fill="#054d3f" stroke="#f8cc49" stroke-width="2"/>
        <path d="M26 5L27.4 9.2L31.5 10.5L27.4 11.8L26 16L24.6 11.8L20.5 10.5L24.6 9.2L26 5Z" fill="#49e3e6"/>
        <polygon points="26,15.5 33,23 28.5,23 28.5,27.5 23.5,27.5 23.5,23 19,23" fill="#f8cc49"/>
        <rect x="23.5" y="26" width="5" height="19" rx="1.5" fill="#f8cc49"/>
        <path d="M11 22.5H21V26H15.5V28.5H19.5V31H15.5V34H21V37.5H11V22.5Z" fill="#f8cc49"/>
        <rect x="15.5" y="26" width="4.5" height="2.5" fill="#ffffff"/>
        <rect x="15.5" y="31" width="4.5" height="3" fill="#ffffff"/>
        <path d="M29 22.5H35.5C39 22.5 41.5 24.8 41.5 28C41.5 31.2 39 33.5 35.5 33.5H29V22.5ZM29 30.5H35C36.8 30.5 38 29.5 38 28C38 26.5 36.8 25.5 35 25.5H29V30.5Z" fill="#f8cc49"/>
        <rect x="30" y="26" width="5.5" height="4" rx="1" fill="#ffffff"/>
      </svg>
    </div>
    <div class="error-num">404</div>
    <h1 class="error-title">Destination Not Found</h1>
    <p class="error-desc">
      The page or channel route you are looking for does not exist or has been relocated within the EdParth directory.
    </p>
    <a href="/" class="btn-home">
      ← Return to Channels Directory
    </a>
  </div>
</body>
</html>
