<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | EdParth</title>
  
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0c26;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow-x: hidden;
    }
    .error-card {
      max-width: 520px;
      width: 100%;
      background: #131448;
      border: 2px solid rgba(248, 204, 73, 0.4);
      border-radius: 24px;
      padding: 50px 32px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
    }
    .error-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #f8cc49;
    }
    .error-logo img { width: 100%; height: 100%; object-fit: cover; }
    .error-num {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 6.5rem;
      font-weight: 900;
      color: #f8cc49;
      line-height: 0.9;
      text-shadow: 4px 4px 0px #042d25;
      margin-bottom: 12px;
    }
    .error-title {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #efb1c0;
      margin-bottom: 14px;
    }
    .error-desc {
      color: #d1d5f0;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #f8cc49;
      color: #0f1040;
      padding: 14px 32px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(248, 204, 73, 0.4);
    }
    .btn-home:hover {
      background: #ffffff;
      color: #054d3f;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-logo">
      <img src="assets/edparth_icon.jpg" alt="EdParth Logo" />
    </div>
    <div class="error-num">404</div>
    <h1 class="error-title">Destination Not Found</h1>
    <p class="error-desc">
      The page or channel route you are looking for does not exist or has been relocated within the EdParth directory.
    </p>
    <a href="/" class="btn-home">
      ← Return to Channels Directory
    </a>
  </div>
</body>
</html>
